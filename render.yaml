services:
  - type: web
    name: novacorp-healthcare-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: novacorp_healthcare
      - key: JWT_SECRET
        generateValue: true
      - key: BUILT_IN_FORGE_API_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NOVACORP_ADK_MODEL
        value: gemini-3.6-flash
